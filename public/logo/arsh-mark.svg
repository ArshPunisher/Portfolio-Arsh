<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Arsh — compact avatar mark">
  <defs>
    <linearGradient id="mskin" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#F3C9A0"/>
      <stop offset="100%" stop-color="#E0A97B"/>
    </linearGradient>
    <linearGradient id="mring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5B21D6"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
    <linearGradient id="mturban" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#6D4DE3"/>
      <stop offset="100%" stop-color="#4514AE"/>
    </linearGradient>
    <clipPath id="mClip"><circle cx="256" cy="256" r="216"/></clipPath>
    <clipPath id="mTurbanClip">
      <path d="M122 212C116 124 164 62 256 62c92 0 140 62 134 150-24-13-60-19-96-21l-38 26-38-26c-36 2-72 8-96 21z"/>
    </clipPath>
  </defs>

  <!-- brand ring keeps the mark readable on any background -->
  <circle cx="256" cy="256" r="234" fill="url(#mring)"/>
  <circle cx="256" cy="256" r="216" fill="#FBF9F5"/>

  <g clip-path="url(#mClip)">
    <!-- shoulders peeking in at the base -->
    <path d="M256 400c-70 0-128 42-146 104h292c-18-62-76-104-146-104z" fill="url(#mring)"/>
    <path d="M222 380h68v42c0 12-15 20-34 20s-34-8-34-20z" fill="#DFA475"/>

    <!-- head, sized large so it survives 16px -->
    <path d="M256 92c-70 0-118 46-118 116v56c0 68 52 118 118 118s118-50 118-118v-56c0-70-48-116-118-116z"
          fill="url(#mskin)"/>
    <ellipse cx="136" cy="262" rx="18" ry="26" fill="#E0A97B"/>
    <ellipse cx="376" cy="262" rx="18" ry="26" fill="#E0A97B"/>

    <!-- ===== Dastaar (turban) ===== -->
    <path d="M122 212C116 124 164 62 256 62c92 0 140 62 134 150-24-13-60-19-96-21l-38 26-38-26c-36 2-72 8-96 21z"
          fill="url(#mturban)"/>
    <g clip-path="url(#mTurbanClip)" fill="none" stroke="#33099A" stroke-width="9" stroke-linecap="round" opacity="0.85">
      <path d="M110 198C154 136 208 98 294 88"/>
      <path d="M116 164C162 108 220 76 306 70"/>
      <path d="M128 130C176 88 228 64 310 62"/>
      <path d="M152 222C202 168 260 136 344 132"/>
    </g>
    <path d="M164 110C198 78 238 64 278 64" stroke="#9B7BF0" stroke-width="11" stroke-linecap="round"
          fill="none" opacity="0.55"/>
    <!-- the nok: crisp centre fold -->
    <path d="M256 220l-16-14h32z" fill="#33099A" opacity="0.9"/>

    <!-- brows -->
    <path d="M182 252c15-10 35-11 51-3" stroke="#140A24" stroke-width="15" stroke-linecap="round" fill="none"/>
    <path d="M279 249c16-8 36-7 51 3" stroke="#140A24" stroke-width="15" stroke-linecap="round" fill="none"/>

    <!-- glasses: the strongest small-size cue, so drawn heavy -->
    <rect x="152" y="264" width="82" height="64" rx="20" fill="#FFFFFF" fill-opacity="0.35" stroke="#140A24" stroke-width="16"/>
    <rect x="278" y="264" width="82" height="64" rx="20" fill="#FFFFFF" fill-opacity="0.35" stroke="#140A24" stroke-width="16"/>
    <path d="M234 294h44" stroke="#140A24" stroke-width="16" stroke-linecap="round"/>
    <path d="M152 286l-22-8" stroke="#140A24" stroke-width="16" stroke-linecap="round"/>
    <path d="M360 286l22-8" stroke="#140A24" stroke-width="16" stroke-linecap="round"/>

    <!-- eyes -->
    <circle cx="193" cy="296" r="13" fill="#140A24"/>
    <circle cx="319" cy="296" r="13" fill="#140A24"/>

    <!-- smile -->
    <path d="M224 356c19 15 45 15 64 0" stroke="#140A24" stroke-width="16" stroke-linecap="round" fill="none"/>
  </g>
</svg>
