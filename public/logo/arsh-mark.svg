<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Arsh — compact avatar mark">
  <defs>
    <linearGradient id="mskin" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#F3C9A0"/>
      <stop offset="100%" stop-color="#E0A97B"/>
    </linearGradient>
    <linearGradient id="mring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5B21D6"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
    <clipPath id="mClip"><circle cx="256" cy="256" r="216"/></clipPath>
  </defs>

  <!-- brand ring keeps the mark readable on any background -->
  <circle cx="256" cy="256" r="234" fill="url(#mring)"/>
  <circle cx="256" cy="256" r="216" fill="#FBF9F5"/>

  <g clip-path="url(#mClip)">
    <!-- shoulders peeking in at the base -->
    <path d="M256 400c-70 0-128 42-146 104h292c-18-62-76-104-146-104z" fill="url(#mring)"/>
    <path d="M222 380h68v42c0 12-15 20-34 20s-34-8-34-20z" fill="#DFA475"/>

    <!-- head, sized large so it survives 16px -->
    <path d="M256 92c-70 0-118 46-118 116v56c0 68 52 118 118 118s118-50 118-118v-56c0-70-48-116-118-116z"
          fill="url(#mskin)"/>
    <ellipse cx="136" cy="252" rx="18" ry="26" fill="#E0A97B"/>
    <ellipse cx="376" cy="252" rx="18" ry="26" fill="#E0A97B"/>

    <!-- hair -->
    <path d="M138 214c0-78 52-126 118-126s118 48 118 126c0 10-1 18-2 26-7-38-20-62-38-73-24 22-63 33-113 31-33-1-57 13-70 44-6 15-11 30-13 44-1-9-2-19-2-30z"
          fill="#140A24"/>

    <!-- brows -->
    <path d="M180 240c15-10 35-11 51-3" stroke="#140A24" stroke-width="15" stroke-linecap="round" fill="none"/>
    <path d="M281 237c16-8 36-7 51 3" stroke="#140A24" stroke-width="15" stroke-linecap="round" fill="none"/>

    <!-- glasses: the strongest small-size cue, so drawn heavy -->
    <rect x="152" y="252" width="82" height="66" rx="20" fill="#FFFFFF" fill-opacity="0.35" stroke="#140A24" stroke-width="16"/>
    <rect x="278" y="252" width="82" height="66" rx="20" fill="#FFFFFF" fill-opacity="0.35" stroke="#140A24" stroke-width="16"/>
    <path d="M234 283h44" stroke="#140A24" stroke-width="16" stroke-linecap="round"/>
    <path d="M152 274l-22-8" stroke="#140A24" stroke-width="16" stroke-linecap="round"/>
    <path d="M360 274l22-8" stroke="#140A24" stroke-width="16" stroke-linecap="round"/>

    <!-- eyes -->
    <circle cx="193" cy="285" r="13" fill="#140A24"/>
    <circle cx="319" cy="285" r="13" fill="#140A24"/>

    <!-- smile -->
    <path d="M222 352c20 16 48 16 68 0" stroke="#140A24" stroke-width="16" stroke-linecap="round" fill="none"/>
  </g>
</svg>
