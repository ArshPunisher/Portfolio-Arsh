<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Arsh — developer avatar logo">
  <defs>
    <!-- Brand palette, matched to the site theme -->
    <linearGradient id="hoodie" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5B21D6"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
    <linearGradient id="skin" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#F3C9A0"/>
      <stop offset="100%" stop-color="#E0A97B"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#5B21D6" stop-opacity="0.18"/>
    </linearGradient>
    <clipPath id="headClip">
      <path d="M256 78c-63 0-108 42-108 106v52c0 62 48 108 108 108s108-46 108-108v-52c0-64-45-106-108-106z"/>
    </clipPath>
  </defs>

  <!-- ===== Shoulders / hoodie ===== -->
  <path d="M256 330c-72 0-140 40-160 104-6 20 8 40 29 40h262c21 0 35-20 29-40-20-64-88-104-160-104z"
        fill="url(#hoodie)"/>
  <!-- hoodie collar opening -->
  <path d="M203 344c14 30 33 46 53 46s39-16 53-46c-16-8-34-12-53-12s-37 4-53 12z"
        fill="#140A24" opacity="0.22"/>

  <!-- ===== Neck ===== -->
  <path d="M222 286h68v56c0 12-15 20-34 20s-34-8-34-20z" fill="#DFA475"/>

  <!-- ===== Head ===== -->
  <path d="M256 78c-63 0-108 42-108 106v52c0 62 48 108 108 108s108-46 108-108v-52c0-64-45-106-108-106z"
        fill="url(#skin)"/>

  <!-- ears -->
  <ellipse cx="146" cy="228" rx="17" ry="24" fill="#E0A97B"/>
  <ellipse cx="366" cy="228" rx="17" ry="24" fill="#E0A97B"/>

  <!-- ===== Hair ===== -->
  <g clip-path="url(#headClip)">
    <path d="M148 196c0-72 48-118 108-118s108 46 108 118c0 8-1 16-2 22-6-34-18-56-34-66-22 20-58 30-104 28-30-1-52 12-64 40-6 14-10 28-12 40-1-8-2-16-2-24z"
          fill="#140A24"/>
  </g>
  <!-- side-swept fringe accent -->
  <path d="M172 176c22-42 62-62 104-58-34 10-58 26-74 50-12 18-20 38-24 60-4-18-6-36-6-52z"
        fill="#241734" opacity="0.75"/>

  <!-- ===== Brows ===== -->
  <path d="M186 216c14-9 32-10 47-3" stroke="#140A24" stroke-width="13" stroke-linecap="round" fill="none"/>
  <path d="M279 213c15-7 33-6 47 3" stroke="#140A24" stroke-width="13" stroke-linecap="round" fill="none"/>

  <!-- ===== Glasses (the developer tell) ===== -->
  <g>
    <rect x="164" y="228" width="74" height="60" rx="18" fill="url(#lens)" stroke="#140A24" stroke-width="12"/>
    <rect x="274" y="228" width="74" height="60" rx="18" fill="url(#lens)" stroke="#140A24" stroke-width="12"/>
    <path d="M238 256h36" stroke="#140A24" stroke-width="12" stroke-linecap="round"/>
    <path d="M164 250l-24-8" stroke="#140A24" stroke-width="12" stroke-linecap="round"/>
    <path d="M348 250l24-8" stroke="#140A24" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- ===== Eyes ===== -->
  <circle cx="201" cy="258" r="11" fill="#140A24"/>
  <circle cx="311" cy="258" r="11" fill="#140A24"/>
  <circle cx="205" cy="254" r="4" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="315" cy="254" r="4" fill="#FFFFFF" opacity="0.9"/>

  <!-- ===== Nose + smile ===== -->
  <path d="M256 274v20c0 6-5 9-11 9" stroke="#C98A5E" stroke-width="10" stroke-linecap="round" fill="none"/>
  <path d="M226 318c18 14 42 14 60 0" stroke="#140A24" stroke-width="13" stroke-linecap="round" fill="none"/>

  <!-- ===== Code mark on the chest ===== -->
  <g stroke="#FBF9F5" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M212 412l-22 22 22 22"/>
    <path d="M300 412l22 22-22 22"/>
  </g>
</svg>
