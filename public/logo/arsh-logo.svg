<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Arsh — developer avatar logo">
  <defs>
    <!-- Brand palette, matched to the site theme -->
    <linearGradient id="hoodie" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5B21D6"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
    <linearGradient id="skin" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#F3C9A0"/>
      <stop offset="100%" stop-color="#E0A97B"/>
    </linearGradient>
    <linearGradient id="turban" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#6D4DE3"/>
      <stop offset="100%" stop-color="#4514AE"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#5B21D6" stop-opacity="0.18"/>
    </linearGradient>
    <clipPath id="turbanClip">
      <path d="M134 196C128 116 170 58 256 58c86 0 128 58 122 138-22-12-56-18-90-20l-32 24-32-24c-34 2-68 8-90 20z"/>
    </clipPath>
  </defs>

  <!-- ===== Shoulders / hoodie ===== -->
  <path d="M256 330c-72 0-140 40-160 104-6 20 8 40 29 40h262c21 0 35-20 29-40-20-64-88-104-160-104z"
        fill="url(#hoodie)"/>
  <path d="M203 344c14 30 33 46 53 46s39-16 53-46c-16-8-34-12-53-12s-37 4-53 12z"
        fill="#140A24" opacity="0.22"/>

  <!-- ===== Neck ===== -->
  <path d="M222 286h68v56c0 12-15 20-34 20s-34-8-34-20z" fill="#DFA475"/>

  <!-- ===== Head ===== -->
  <path d="M256 78c-63 0-108 42-108 106v52c0 62 48 108 108 108s108-46 108-108v-52c0-64-45-106-108-106z"
        fill="url(#skin)"/>

  <!-- ears (sit below the dastaar line) -->
  <ellipse cx="146" cy="238" rx="17" ry="24" fill="#E0A97B"/>
  <ellipse cx="366" cy="238" rx="17" ry="24" fill="#E0A97B"/>

  <!-- ===== Dastaar (turban) ===== -->
  <!-- main wrapped mass, with the front nok dipping to a point at centre -->
  <path d="M134 196C128 116 170 58 256 58c86 0 128 58 122 138-22-12-56-18-90-20l-32 24-32-24c-34 2-68 8-90 20z"
        fill="url(#turban)"/>
  <!-- layered wrap lines -->
  <g clip-path="url(#turbanClip)" fill="none" stroke="#33099A" stroke-width="7" stroke-linecap="round" opacity="0.85">
    <path d="M124 182C164 126 214 92 292 84"/>
    <path d="M130 152C174 104 226 76 304 70"/>
    <path d="M142 122C186 84 234 64 308 60"/>
    <path d="M164 206C210 156 264 126 340 122"/>
  </g>
  <!-- soft highlight along the crown -->
  <path d="M170 106C202 76 240 62 278 62" stroke="#9B7BF0" stroke-width="9" stroke-linecap="round"
        fill="none" opacity="0.55"/>
  <!-- the nok: crisp centre fold -->
  <path d="M256 200l-14-12h28z" fill="#33099A" opacity="0.9"/>

  <!-- ===== Brows ===== -->
  <path d="M188 228c14-9 32-10 47-3" stroke="#140A24" stroke-width="13" stroke-linecap="round" fill="none"/>
  <path d="M277 225c15-7 33-6 47 3" stroke="#140A24" stroke-width="13" stroke-linecap="round" fill="none"/>

  <!-- ===== Glasses ===== -->
  <g>
    <rect x="164" y="238" width="74" height="58" rx="18" fill="url(#lens)" stroke="#140A24" stroke-width="12"/>
    <rect x="274" y="238" width="74" height="58" rx="18" fill="url(#lens)" stroke="#140A24" stroke-width="12"/>
    <path d="M238 265h36" stroke="#140A24" stroke-width="12" stroke-linecap="round"/>
    <path d="M164 259l-22-8" stroke="#140A24" stroke-width="12" stroke-linecap="round"/>
    <path d="M348 259l22-8" stroke="#140A24" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- ===== Eyes ===== -->
  <circle cx="201" cy="267" r="11" fill="#140A24"/>
  <circle cx="311" cy="267" r="11" fill="#140A24"/>
  <circle cx="205" cy="263" r="4" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="315" cy="263" r="4" fill="#FFFFFF" opacity="0.9"/>

  <!-- ===== Nose + smile ===== -->
  <path d="M256 282v18c0 6-5 9-11 9" stroke="#C98A5E" stroke-width="10" stroke-linecap="round" fill="none"/>
  <path d="M228 322c17 13 39 13 56 0" stroke="#140A24" stroke-width="13" stroke-linecap="round" fill="none"/>

  <!-- ===== Code mark on the chest ===== -->
  <g stroke="#FBF9F5" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M212 412l-22 22 22 22"/>
    <path d="M300 412l22 22-22 22"/>
  </g>
</svg>
